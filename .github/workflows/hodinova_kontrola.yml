# Ulož jako .github/workflows/lastminute.yml
name: Last minute bot

on:
  schedule:
    # Každých 30 minut (repo je veřejné = minuty zdarma bez limitu).
    # Minuty 7 a 37 záměrně - v celou/půl jsou fronty GitHubu přetížené
    # a plánované běhy se zpožďují nebo přeskakují.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # ruční spuštění tlačítkem

# Nikdy nesmí běžet dva běhy naráz - přepisovaly by si seen.json.
# cancel-in-progress: false = nový běh počká, rozběhnutý se nezabíjí.
concurrency:
  group: lastminute-bot
  cancel-in-progress: false

permissions:
  contents: write   # kvůli commitu seen.json/stats.json zpět do repa

jobs:
  run:
    runs-on: ubuntu-latest
    # ZMĚNA: 100 minut bylo víc, než je perioda spouštění (30 min). Jeden
    # zaseknutý běh tak mohl zablokovat frontu na hodiny, protože další
    # běhy kvůli concurrency čekají. 25 minut = zaseknutý běh se ukončí
    # dřív, než přijde ten následující.
    # Bot si sám hlídá kratší rozpočet (CASOVY_ROZPOCET_MINUT) a před jeho
    # vypršením se korektně ukončí včetně uložení stavu. Tenhle timeout je
    # jen tvrdá pojistka, musí být VYŠŠÍ než rozpočet bota.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # ZMĚNA: "git pull --rebase" v posledním kroku potřebuje historii.
          # S výchozí mělkou kopií (depth 1) rebase občas selže a push
          # neprojde - stav se pak neuloží.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      # ZMĚNA: rychlá kontrola, že se skript vůbec načte a projde testy.
      # Chytí překlep dřív, než se rozjede 10 minut scrapování.
      - name: Self-test
        run: |
          python -m compileall -q lastminute_bot.py
          TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python test_bot.py
          TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python test_integrace.py

      # Cache Chromu (~150 MB) - bez ní se stahuje každý běh (~1 min).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # Cache se ukládá až v post-job kroku, který se po zabití běhu
      # neprovede - Chrome (300 MB) by se pak stahoval pořád dokola.
      # Uložíme ho hned po instalaci, ještě než se pustí bot.
      - name: Save Playwright cache
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lastminute_bot.py

      # Uložení paměti bota zpět do repa.
      # ZMĚNA: if: always() - když bot spadne uprostřed, dřív se tenhle krok
      # vůbec nespustil a rozpracovaný stav se zahodil. Další běh pak poslal
      # už jednou ohlášené nabídky znovu. Teď se uloží, co se stihlo.
      - name: Commit state
        if: always()
        run: |
          git config user.name "lastminute-bot"
          git config user.email "actions@users.noreply.github.com"
          # POZOR: "git add a.json b.json c.json" je ATOMICKÝ - když jeden
          # soubor neexistuje (ck.json vzniká až prvním během), git
          # nepřidá ANI JEDEN a stav se tiše ztratí. Proto po jednom.
          for f in seen.json stats.json ck.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Žádná změna stavu."
          else
            git commit -m "chore: update bot state [skip ci]"
            # Několik pokusů: mezitím mohl pushnout někdo jiný.
            for i in 1 2 3; do
              git pull --rebase && git push && break
              echo "Push pokus $i selhal, zkouším znovu..."
              sleep 5
            done
          fi
